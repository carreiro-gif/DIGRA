<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#3b82f6">
<title>DIGRA — Calculadora de Placas</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: #0f172a;
    color: #f1f5f9;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 16px;
  }

  .header {
    width: 100%;
    max-width: 480px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 16px;
  }

  .logo {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .logo-text {
    font-size: 20px;
    font-weight: 900;
    color: #3b82f6;
    letter-spacing: -0.5px;
  }

  .logo-sub {
    font-size: 9px;
    color: #64748b;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.15em;
  }

  .settings-btn {
    width: 36px;
    height: 36px;
    background: #1e293b;
    border: 1px solid #334155;
    border-radius: 10px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #94a3b8;
    font-size: 16px;
    transition: all 0.2s;
  }

  .settings-btn:hover { background: #334155; color: #f1f5f9; }

  .card {
    width: 100%;
    max-width: 480px;
    background: #1e293b;
    border: 1px solid #334155;
    border-radius: 16px;
    padding: 16px;
    margin-bottom: 12px;
  }

  .card-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 14px;
  }

  .card-number {
    width: 26px;
    height: 26px;
    background: #3b82f6;
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 11px;
    font-weight: 900;
    color: white;
  }

  .type-tabs {
    display: flex;
    gap: 4px;
    background: #0f172a;
    padding: 4px;
    border-radius: 10px;
    flex: 1;
    margin: 0 10px;
  }

  .type-tab {
    flex: 1;
    padding: 5px 4px;
    border: none;
    border-radius: 7px;
    font-size: 9px;
    font-weight: 800;
    cursor: pointer;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    transition: all 0.2s;
    background: transparent;
    color: #64748b;
  }

  .type-tab.active {
    color: white;
  }

  .type-tab.simples.active { background: #2563eb; }
  .type-tab.plastificada.active { background: #059669; }
  .type-tab.vinil.active { background: #7c3aed; }

  .remove-btn {
    width: 28px;
    height: 28px;
    background: #7f1d1d;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    color: #fca5a5;
    font-size: 14px;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.2s;
  }

  .remove-btn:hover { background: #991b1b; }

  .inputs-row {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 8px;
    margin-bottom: 12px;
  }

  .input-group label {
    display: block;
    font-size: 9px;
    font-weight: 800;
    color: #64748b;
    text-transform: uppercase;
    letter-spacing: 0.15em;
    margin-bottom: 5px;
  }

  .input-group input {
    width: 100%;
    background: #0f172a;
    border: 1px solid #334155;
    border-radius: 8px;
    padding: 8px 10px;
    color: #f1f5f9;
    font-size: 15px;
    font-weight: 700;
    outline: none;
    transition: border-color 0.2s;
    text-align: center;
  }

  .input-group input:focus { border-color: #3b82f6; }
  .input-group input::placeholder { color: #475569; font-size: 12px; }

  .result-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
  }

  .result-box {
    background: #0f172a;
    border: 1px solid #334155;
    border-radius: 10px;
    padding: 10px 12px;
    position: relative;
  }

  .result-box label {
    display: block;
    font-size: 8px;
    font-weight: 800;
    color: #64748b;
    text-transform: uppercase;
    letter-spacing: 0.15em;
    margin-bottom: 3px;
  }

  .result-value {
    font-size: 18px;
    font-weight: 900;
    color: #f1f5f9;
  }

  .result-box.highlight {
    border-color: #3b82f6;
    background: #172554;
  }

  .result-box.highlight .result-value { color: #60a5fa; }

  .copy-btn {
    position: absolute;
    top: 8px;
    right: 8px;
    width: 22px;
    height: 22px;
    background: #334155;
    border: none;
    border-radius: 6px;
    cursor: pointer;
    color: #94a3b8;
    font-size: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.2s;
  }

  .copy-btn:hover { background: #3b82f6; color: white; }
  .copy-btn.copied { background: #059669; color: white; }

  .add-btn {
    width: 100%;
    max-width: 480px;
    padding: 12px;
    background: #1e293b;
    border: 2px dashed #334155;
    border-radius: 12px;
    color: #64748b;
    font-size: 12px;
    font-weight: 800;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    cursor: pointer;
    transition: all 0.2s;
    margin-bottom: 12px;
  }

  .add-btn:hover { border-color: #3b82f6; color: #3b82f6; background: #172554; }

  .total-card {
    width: 100%;
    max-width: 480px;
    background: linear-gradient(135deg, #1e3a8a, #1e40af);
    border: 1px solid #3b82f6;
    border-radius: 16px;
    padding: 20px;
    margin-bottom: 12px;
  }

  .total-label {
    font-size: 9px;
    font-weight: 800;
    color: #93c5fd;
    text-transform: uppercase;
    letter-spacing: 0.2em;
    margin-bottom: 6px;
  }

  .total-value {
    font-size: 36px;
    font-weight: 900;
    color: white;
    margin-bottom: 16px;
  }

  .total-actions {
    display: flex;
    gap: 8px;
  }

  .copy-total-btn {
    flex: 1;
    padding: 10px;
    background: #3b82f6;
    border: none;
    border-radius: 10px;
    color: white;
    font-size: 11px;
    font-weight: 800;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    cursor: pointer;
    transition: all 0.2s;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
  }

  .copy-total-btn:hover { background: #2563eb; }
  .copy-total-btn.copied { background: #059669; }

  .clear-btn {
    padding: 10px 16px;
    background: #7f1d1d;
    border: none;
    border-radius: 10px;
    color: #fca5a5;
    font-size: 11px;
    font-weight: 800;
    text-transform: uppercase;
    cursor: pointer;
    transition: all 0.2s;
  }

  .clear-btn:hover { background: #991b1b; }

  /* Settings Modal */
  .modal-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.8);
    z-index: 100;
    align-items: center;
    justify-content: center;
  }

  .modal-overlay.open { display: flex; }

  .modal {
    background: #1e293b;
    border: 1px solid #334155;
    border-radius: 20px;
    padding: 24px;
    width: 90%;
    max-width: 400px;
  }

  .modal h2 {
    font-size: 14px;
    font-weight: 900;
    color: #f1f5f9;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    margin-bottom: 20px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .modal-close {
    background: none;
    border: none;
    color: #64748b;
    font-size: 20px;
    cursor: pointer;
    line-height: 1;
  }

  .setting-row {
    margin-bottom: 14px;
  }

  .setting-row label {
    display: block;
    font-size: 10px;
    font-weight: 800;
    color: #64748b;
    text-transform: uppercase;
    letter-spacing: 0.15em;
    margin-bottom: 6px;
  }

  .setting-input-wrap {
    position: relative;
  }

  .setting-input-wrap span {
    position: absolute;
    left: 12px;
    top: 50%;
    transform: translateY(-50%);
    color: #64748b;
    font-weight: 700;
    font-size: 13px;
  }

  .setting-row input {
    width: 100%;
    background: #0f172a;
    border: 1px solid #334155;
    border-radius: 10px;
    padding: 10px 12px 10px 32px;
    color: #f1f5f9;
    font-size: 14px;
    font-weight: 700;
    outline: none;
  }

  .setting-row input:focus { border-color: #3b82f6; }

  .save-btn {
    width: 100%;
    padding: 12px;
    background: #3b82f6;
    border: none;
    border-radius: 10px;
    color: white;
    font-size: 12px;
    font-weight: 900;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    cursor: pointer;
    margin-top: 8px;
    transition: all 0.2s;
  }

  .save-btn:hover { background: #2563eb; }

  .items-summary {
    width: 100%;
    max-width: 480px;
    margin-bottom: 8px;
  }

  .summary-item {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 6px 0;
    border-bottom: 1px solid #1e293b;
    font-size: 11px;
  }

  .summary-item:last-child { border-bottom: none; }
  .summary-item-name { color: #94a3b8; }
  .summary-item-value { color: #f1f5f9; font-weight: 700; }

  .badge {
    display: inline-block;
    padding: 2px 7px;
    border-radius: 5px;
    font-size: 8px;
    font-weight: 800;
    text-transform: uppercase;
    margin-right: 6px;
  }

  .badge-simples { background: #1d4ed8; color: #bfdbfe; }
  .badge-plastificada { background: #065f46; color: #a7f3d0; }
  .badge-vinil { background: #4c1d95; color: #ddd6fe; }

  .footer {
    width: 100%;
    max-width: 480px;
    text-align: center;
    font-size: 9px;
    color: #334155;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.2em;
    margin-top: 8px;
    padding-bottom: 16px;
  }
</style>
</head>
<body>

<div class="header">
  <div class="logo">
    <div>
      <div class="logo-text">DIGRA</div>
      <div class="logo-sub">Calculadora de Placas</div>
    </div>
  </div>
  <button class="settings-btn" onclick="openSettings()" title="Valores Base">⚙️</button>
</div>

<div id="placas-container"></div>

<button class="add-btn" onclick="addPlaca()">+ Adicionar Placa</button>

<div class="items-summary" id="summary"></div>

<div class="total-card">
  <div class="total-label">Total do Orçamento</div>
  <div class="total-value" id="total-geral">R$ 0,00</div>
  <div class="total-actions">
    <button class="copy-total-btn" id="copy-total-btn" onclick="copyTotal()">
      📋 Copiar Total
    </button>
    <button class="clear-btn" onclick="clearAll()">🗑️ Limpar</button>
  </div>
</div>

<div class="footer">⚡ DIGRA Apps — v2.5.0</div>

<!-- Settings Modal -->
<div class="modal-overlay" id="settings-modal">
  <div class="modal">
    <h2>
      Valores Base
      <button class="modal-close" onclick="closeSettings()">×</button>
    </h2>

    <div class="setting-row">
      <label>Placa Simples (R$/m²)</label>
      <div class="setting-input-wrap">
        <span>R$</span>
        <input type="number" id="s-simples" step="0.01" placeholder="39.00">
      </div>
    </div>

    <div class="setting-row">
      <label>Placa Plastificada (R$/m²)</label>
      <div class="setting-input-wrap">
        <span>R$</span>
        <input type="number" id="s-plastificada" step="0.01" placeholder="52.20">
      </div>
    </div>

    <div class="setting-row">
      <label>Adesivo Vinil (R$/m²)</label>
      <div class="setting-input-wrap">
        <span>R$</span>
        <input type="number" id="s-vinil" step="0.01" placeholder="14.40">
      </div>
    </div>

    <div class="setting-row">
      <label>Máscara Transferência (R$/m²)</label>
      <div class="setting-input-wrap">
        <span>R$</span>
        <input type="number" id="s-mascara" step="0.01" placeholder="9.90">
      </div>
    </div>

    <div class="setting-row">
      <label>Custo Máquina (R$/min)</label>
      <div class="setting-input-wrap">
        <span>R$</span>
        <input type="number" id="s-maquina" step="0.01" placeholder="0.63">
      </div>
    </div>

    <div class="setting-row">
      <label>Mão de Obra (%)</label>
      <div class="setting-input-wrap">
        <span>%</span>
        <input type="number" id="s-maoObra" step="1" placeholder="30" style="padding-left: 32px;">
      </div>
    </div>

    <button class="save-btn" onclick="saveSettings()">✅ Salvar Valores</button>
  </div>
</div>

<script>
  // ─── VALORES BASE ───────────────────────────────────────────
  const DEFAULT_BASE = {
    placaSimples: 39.00,
    placaPlastificada: 52.20,
    vinil: 14.40,
    mascara: 9.90,
    maquina: 0.63,
    maoObra: 30
  };

  let base = { ...DEFAULT_BASE };
  let placas = [];
  let nextId = 1;

  // Carrega valores salvos localmente
  function loadBase() {
    try {
      const saved = localStorage.getItem('digra_placas_base_values');
      if (saved) base = { ...DEFAULT_BASE, ...JSON.parse(saved) };
    } catch(e) {}
  }

  function saveBase() {
    localStorage.setItem('digra_placas_base_values', JSON.stringify(base));
  }

  // ─── CÁLCULOS ───────────────────────────────────────────────
  function calcSimples(l, a) {
    const area = (l * a) / 10000;
    return area * base.placaSimples;
  }

  function calcPlastificada(l, a) {
    const area = (l * a) / 10000;
    return area * base.placaPlastificada;
  }

  function calcVinil(l, a) {
    const area = (l * a) / 10000;
    const custoVinil = area * base.vinil;
    const custoMascara = area * base.mascara;
    const tempoMaquina = (l <= 40 && a <= 40) ? 10 : 60;
    const custoMaquina = tempoMaquina * base.maquina;
    const subtotal = custoVinil + custoMascara + custoMaquina;
    const maoObra = subtotal * (base.maoObra / 100);
    return subtotal + maoObra;
  }

  function calcUnitario(tipo, l, a) {
    if (!l || !a || l <= 0 || a <= 0) return 0;
    if (tipo === 'simples') return calcSimples(l, a);
    if (tipo === 'plastificada') return calcPlastificada(l, a);
    if (tipo === 'vinil') return calcVinil(l, a);
    return 0;
  }

  function fmt(val) {
    return 'R$ ' + val.toFixed(2).replace('.', ',');
  }

  // ─── PLACAS ─────────────────────────────────────────────────
  function addPlaca(tipo = 'simples') {
    const id = nextId++;
    placas.push({ id, tipo, l: '', a: '', qtd: 1 });
    renderPlacas();
  }

  function removePlaca(id) {
    placas = placas.filter(p => p.id !== id);
    renderPlacas();
  }

  function updatePlaca(id, field, value) {
    const p = placas.find(p => p.id === id);
    if (p) {
      p[field] = value;
      renderResults();
    }
  }

  function setTipo(id, tipo) {
    const p = placas.find(p => p.id === id);
    if (p) {
      p.tipo = tipo;
      renderPlacas();
    }
  }

  function clearAll() {
    if (placas.length > 0 && !confirm('Limpar todos os itens?')) return;
    placas = [];
    nextId = 1;
    renderPlacas();
  }

  // ─── RENDER ─────────────────────────────────────────────────
  function renderPlacas() {
    const container = document.getElementById('placas-container');
    container.innerHTML = '';

    if (placas.length === 0) {
      container.innerHTML = `
        <div style="width:100%;max-width:480px;text-align:center;padding:32px 0;color:#334155;">
          <div style="font-size:32px;margin-bottom:8px;">📐</div>
          <div style="font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:0.1em;">
            Adicione uma placa para começar
          </div>
        </div>`;
      renderResults();
      return;
    }

    placas.forEach((p, idx) => {
      const unitario = calcUnitario(p.tipo, parseFloat(p.l), parseFloat(p.a));
      const qtd = parseFloat(p.qtd) || 1;
      const total = unitario * qtd;

      const typeColors = {
        simples: '#2563eb',
        plastificada: '#059669',
        vinil: '#7c3aed'
      };

      const div = document.createElement('div');
      div.className = 'card';
      div.style.width = '100%';
      div.style.maxWidth = '480px';
      div.innerHTML = `
        <div class="card-header">
          <div class="card-number">${idx + 1}</div>
          <div class="type-tabs">
            <button class="type-tab simples ${p.tipo === 'simples' ? 'active' : ''}" onclick="setTipo(${p.id}, 'simples')">Simples</button>
            <button class="type-tab plastificada ${p.tipo === 'plastificada' ? 'active' : ''}" onclick="setTipo(${p.id}, 'plastificada')">Plastif.</button>
            <button class="type-tab vinil ${p.tipo === 'vinil' ? 'active' : ''}" onclick="setTipo(${p.id}, 'vinil')">Vinil</button>
          </div>
          <button class="remove-btn" onclick="removePlaca(${p.id})">✕</button>
        </div>

        <div class="inputs-row">
          <div class="input-group">
            <label>Largura cm</label>
            <input type="number" value="${p.l}" placeholder="0" oninput="updatePlaca(${p.id}, 'l', this.value); updateCard(${p.id}, this.closest('.card'))">
          </div>
          <div class="input-group">
            <label>Altura cm</label>
            <input type="number" value="${p.a}" placeholder="0" oninput="updatePlaca(${p.id}, 'a', this.value); updateCard(${p.id}, this.closest('.card'))">
          </div>
          <div class="input-group">
            <label>Qtd</label>
            <input type="number" value="${p.qtd}" min="1" oninput="updatePlaca(${p.id}, 'qtd', this.value); updateCard(${p.id}, this.closest('.card'))">
          </div>
        </div>

        <div class="result-row">
          <div class="result-box">
            <label>Unitário</label>
            <div class="result-value" id="unit-${p.id}">${fmt(unitario)}</div>
            <button class="copy-btn" onclick="copyValue('${fmt(unitario)}', this)" title="Copiar unitário">📋</button>
          </div>
          <div class="result-box highlight">
            <label>Total (${qtd}x)</label>
            <div class="result-value" id="total-${p.id}">${fmt(total)}</div>
            <button class="copy-btn" onclick="copyValue('${fmt(total)}', this)" title="Copiar total">📋</button>
          </div>
        </div>
      `;
      container.appendChild(div);
    });

    renderResults();
  }

  function updateCard(id, card) {
    const p = placas.find(p => p.id === id);
    if (!p) return;
    const unitario = calcUnitario(p.tipo, parseFloat(p.l), parseFloat(p.a));
    const qtd = parseFloat(p.qtd) || 1;
    const total = unitario * qtd;

    const unitEl = document.getElementById(`unit-${id}`);
    const totalEl = document.getElementById(`total-${id}`);
    if (unitEl) {
      unitEl.textContent = fmt(unitario);
      unitEl.nextElementSibling.onclick = () => copyValue(fmt(unitario), unitEl.nextElementSibling);
    }
    if (totalEl) {
      totalEl.textContent = fmt(total);
      totalEl.parentElement.querySelector('label').textContent = `Total (${qtd}x)`;
      totalEl.nextElementSibling.onclick = () => copyValue(fmt(total), totalEl.nextElementSibling);
    }

    renderResults();
  }

  function renderResults() {
    let totalGeral = 0;
    const summaryEl = document.getElementById('summary');
    let summaryHTML = '';

    placas.forEach((p, idx) => {
      const unitario = calcUnitario(p.tipo, parseFloat(p.l), parseFloat(p.a));
      const qtd = parseFloat(p.qtd) || 1;
      const total = unitario * qtd;
      totalGeral += total;

      if (p.l && p.a && parseFloat(p.l) > 0 && parseFloat(p.a) > 0) {
        const badgeClass = `badge-${p.tipo}`;
        const tipoLabel = p.tipo === 'simples' ? 'Simples' : p.tipo === 'plastificada' ? 'Plastif.' : 'Vinil';
        summaryHTML += `
          <div class="summary-item">
            <div class="summary-item-name">
              <span class="badge ${badgeClass}">${tipoLabel}</span>
              ${p.l}×${p.a}cm × ${qtd}un
            </div>
            <div class="summary-item-value">${fmt(total)}</div>
          </div>`;
      }
    });

    summaryEl.innerHTML = summaryHTML;
    document.getElementById('total-geral').textContent = fmt(totalGeral);
  }

  // ─── COPIAR ─────────────────────────────────────────────────
  function copyValue(val, btn) {
    navigator.clipboard.writeText(val).then(() => {
      const orig = btn.textContent;
      btn.textContent = '✅';
      btn.classList.add('copied');
      setTimeout(() => {
        btn.textContent = orig;
        btn.classList.remove('copied');
      }, 1500);
    });
  }

  function copyTotal() {
    const val = document.getElementById('total-geral').textContent;
    const btn = document.getElementById('copy-total-btn');
    
    let text = `DIGRA — Orçamento de Placas\n`;
    placas.forEach((p, idx) => {
      if (p.l && p.a) {
        const unitario = calcUnitario(p.tipo, parseFloat(p.l), parseFloat(p.a));
        const qtd = parseFloat(p.qtd) || 1;
        const total = unitario * qtd;
        const tipoLabel = p.tipo === 'simples' ? 'Placa Simples' : p.tipo === 'plastificada' ? 'Placa Plastificada' : 'Vinil (Vidro)';
        text += `${idx+1}. ${tipoLabel} ${p.l}×${p.a}cm × ${qtd}un = ${fmt(total)}\n`;
      }
    });
    text += `\nTOTAL GERAL: ${val}`;

    navigator.clipboard.writeText(text).then(() => {
      const orig = btn.innerHTML;
      btn.innerHTML = '✅ Copiado!';
      btn.classList.add('copied');
      setTimeout(() => {
        btn.innerHTML = orig;
        btn.classList.remove('copied');
      }, 2000);
    });
  }

  // ─── SETTINGS ───────────────────────────────────────────────
  function openSettings() {
    document.getElementById('s-simples').value = base.placaSimples;
    document.getElementById('s-plastificada').value = base.placaPlastificada;
    document.getElementById('s-vinil').value = base.vinil;
    document.getElementById('s-mascara').value = base.mascara;
    document.getElementById('s-maquina').value = base.maquina;
    document.getElementById('s-maoObra').value = base.maoObra;
    document.getElementById('settings-modal').classList.add('open');
  }

  function closeSettings() {
    document.getElementById('settings-modal').classList.remove('open');
  }

  function saveSettings() {
    base.placaSimples = parseFloat(document.getElementById('s-simples').value) || DEFAULT_BASE.placaSimples;
    base.placaPlastificada = parseFloat(document.getElementById('s-plastificada').value) || DEFAULT_BASE.placaPlastificada;
    base.vinil = parseFloat(document.getElementById('s-vinil').value) || DEFAULT_BASE.vinil;
    base.mascara = parseFloat(document.getElementById('s-mascara').value) || DEFAULT_BASE.mascara;
    base.maquina = parseFloat(document.getElementById('s-maquina').value) || DEFAULT_BASE.maquina;
    base.maoObra = parseFloat(document.getElementById('s-maoObra').value) || DEFAULT_BASE.maoObra;
    saveBase();
    closeSettings();
    renderPlacas();
    alert('✅ Valores salvos com sucesso!');
  }

  // Fecha modal clicando fora
  document.getElementById('settings-modal').addEventListener('click', function(e) {
    if (e.target === this) closeSettings();
  });

  // ─── INIT ───────────────────────────────────────────────────
  loadBase();
  addPlaca();
</script>
</body>
</html>
